name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck tmux
      - name: shellcheck
        run: shellcheck -S warning bin/* install.sh uninstall.sh test/run.sh
      - name: tests
        run: bash test/run.sh
