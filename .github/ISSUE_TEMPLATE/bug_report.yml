name: Bug report
description: Something routes to the wrong account, fails, or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste emails, tokens, or other account details. Replace them with placeholders.
        Security issues: use "Report a vulnerability" instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command you ran, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: accounts
    attributes:
      label: Output of `kiro-auto accounts` (emails redacted)
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`kiro-cli-real --version` (or `kiro-cli --version`), Windows `kiro-cli.exe --version` if used, `bash --version | head -1`"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [WSL2, Linux]
    validations:
      required: true
  - type: dropdown
    id: shim
    attributes:
      label: Installed with --shim?
      options: ["yes", "no"]
